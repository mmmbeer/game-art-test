<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TGC Art Test Platform</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/app.css">
  </head>
  <body class="app-body">
    <div class="app-shell">
      <header class="app-header">
        <div>
          <p class="app-eyebrow">TGC Art Test Platform</p>
          <h1 class="app-title">Creator Login</h1>
        </div>
        <button class="btn btn-outline-light btn-sm" id="themeToggle" type="button">
          Switch Theme
        </button>
      </header>

      <main class="app-main">
        <section id="loginView" class="card app-card">
          <div class="card-body">
            <h2 class="card-title">Sign in to The Game Crafter</h2>
            <p class="card-subtitle">Use your TGC username and password.</p>
            <form id="loginForm" class="mt-4" method="post" action="auth/tgc/login" novalidate>
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" name="username" type="text" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
              </div>
              <button class="btn btn-primary w-100" type="submit" id="loginButton">
                Sign In
              </button>
            </form>
          </div>
        </section>

        <section id="gamesView" class="card app-card d-none">
          <div class="card-body">
            <h2 class="card-title">Select a Game</h2>
            <p class="card-subtitle" id="userDisplay"></p>
            <div id="gamesList" class="games-list"></div>
            <button class="btn btn-primary w-100 mt-3" id="confirmGame" type="button" disabled>
              Continue
            </button>
          </div>
        </section>
      </main>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastHost"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
