<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TGC Art Test - Vote</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/themes.css">
    <link rel="stylesheet" href="../../css/tester.css">
  </head>
  <body class="tester-body">
    <div class="tester-shell">
      <section class="asset-sticky">
        <header class="tester-header">
          <div class="tester-game" id="testTitle">Loading game...</div>
          <div class="tester-asset-name" id="assetName">Loading asset...</div>
        </header>
        <div class="divider-line"></div>
        <div class="asset-frame" id="assetFrame">
          <div class="asset-loading" id="assetLoading">
            <div class="pulse-dot"></div>
            <span>Loading art...</span>
          </div>
          <div class="zoom-indicator" id="zoomIndicator">100%</div>
          <img id="assetImage" alt="Art asset preview">
        </div>
        <div class="divider-line"></div>
        <div class="asset-type-line" id="assetType">Asset type</div>
      </section>

      <section class="ratings-panel" id="ratingPanel">
        <div class="rating-row" data-metric="appeal">
          <div
            class="rating-label"
            title="Overall visual appeal and attention grab."
          >Appeal</div>
          <div class="rating-stars" role="group" aria-label="Appeal rating">
            <button type="button" class="star-button" data-value="1" aria-label="1 star"></button>
            <button type="button" class="star-button" data-value="2" aria-label="2 stars"></button>
            <button type="button" class="star-button" data-value="3" aria-label="3 stars"></button>
            <button type="button" class="star-button" data-value="4" aria-label="4 stars"></button>
            <button type="button" class="star-button" data-value="5" aria-label="5 stars"></button>
          </div>
        </div>

        <div class="rating-row" data-metric="understandability">
          <div
            class="rating-label"
            title="How easy it is to grasp at a glance."
          >Intuitive</div>
          <div class="rating-stars" role="group" aria-label="Intuitive rating">
            <button type="button" class="star-button" data-value="1" aria-label="1 star"></button>
            <button type="button" class="star-button" data-value="2" aria-label="2 stars"></button>
            <button type="button" class="star-button" data-value="3" aria-label="3 stars"></button>
            <button type="button" class="star-button" data-value="4" aria-label="4 stars"></button>
            <button type="button" class="star-button" data-value="5" aria-label="5 stars"></button>
          </div>
        </div>

        <div class="rating-row" data-metric="professionalism">
          <div
            class="rating-label"
            title="Polish, technical quality, and print readiness."
          >Professionalism</div>
          <div class="rating-stars" role="group" aria-label="Professionalism rating">
            <button type="button" class="star-button" data-value="1" aria-label="1 star"></button>
            <button type="button" class="star-button" data-value="2" aria-label="2 stars"></button>
            <button type="button" class="star-button" data-value="3" aria-label="3 stars"></button>
            <button type="button" class="star-button" data-value="4" aria-label="4 stars"></button>
            <button type="button" class="star-button" data-value="5" aria-label="5 stars"></button>
          </div>
        </div>

        <div class="comment-row">
          <label for="commentInput">Comments</label>
          <textarea
            id="commentInput"
            rows="1"
            placeholder="Comments..."
          ></textarea>
          <div class="comment-hint" id="commentHint">0 / 500</div>
        </div>
      </section>

      <section class="action-row">
        <button class="primary-btn" id="submitVote" type="button" disabled>next ></button>
        <div class="progress-mini">
          <span id="remainingAssets">-</span>
          <span>assets</span>
          <span class="dot">|</span>
          <span id="minVotes">-</span>
          <span>votes per asset</span>
          <span class="dot">|</span>
          <span id="sessionVotes">0</span>
          <span>votes from you</span>
        </div>
      </section>

      <section class="complete-panel hidden" id="completePanel">
        <h2>All caught up!</h2>
        <p>There are no more assets to review right now.</p>
        <button class="primary-btn" id="reloadButton" type="button">Check again</button>
      </section>
    </div>

    <div class="toast-host" id="toastHost" aria-live="polite"></div>
    <script type="module" src="../../js/tester/app.js"></script>
  </body>
</html>
