<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TGC Art Test - Vote</title>
    <link rel="stylesheet" href="../../css/variables.css">
    <link rel="stylesheet" href="../../css/themes.css">
    <link rel="stylesheet" href="../../css/tester.css">
  </head>
  <body class="tester-body">
    <div class="tester-shell">
      <section class="asset-sticky">
        <header class="tester-header">
          <div class="tester-game" id="testTitle">Loading game...</div>
          <div class="tester-asset-row">
            <div class="tester-asset-name" id="assetName">Loading asset...</div>
            <div class="tester-controls" aria-label="Viewer tools">
              <button class="control-btn" id="toggleOverlay" type="button" aria-pressed="false">
                Overlay
              </button>
              <button class="control-btn" id="toggleBackground" type="button" aria-pressed="false">
                BG
              </button>
              <button class="control-btn" id="rotateButton" type="button" aria-pressed="false">
                Rotate
              </button>
              <button class="control-btn" id="cropButton" type="button" aria-pressed="false">
                Crop
              </button>
              <button class="control-btn" id="driftButton" type="button" aria-pressed="false">
                +Drift
              </button>
            </div>
          </div>
        </header>
        <div class="asset-frame" id="assetFrame">
          <div class="asset-loading" id="assetLoading">
            <div class="pulse-dot"></div>
            <span>Loading art...</span>
          </div>
          <div class="zoom-indicator" id="zoomIndicator">100%</div>
          <div class="viewer-tools" id="viewerTools">
            <button class="tool-btn" type="button" data-zoom="fit">Fit</button>
            <button class="tool-btn" type="button" data-zoom="actual">Actual</button>
            <button class="tool-btn" type="button" id="resetView">Reset</button>
          </div>
          <div class="asset-stage" id="assetStage">
            <div class="asset-bounds" id="assetBounds">
              <div class="asset-drift-crop" id="assetDriftCrop">
                <div class="asset-transform" id="assetTransform">
                  <img id="assetImage" alt="Art asset preview">
                  <img id="overlayImage" class="overlay-image hidden" alt="Template overlay">
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="asset-type-line" id="assetType">Asset type</div>
      </section>

      <section class="vote-dock" id="ratingPanel">
        <div class="vote-loading hidden" id="voteLoading" aria-live="polite">
          <span class="spinner"></span>
          <span>Loading...</span>
        </div>
        <div class="vote-carousel" aria-live="polite">
          <div class="vote-track" id="voteTrack">
            <div class="vote-slide" data-metric="appeal">
              <div class="vote-label" title="Overall visual appeal and attention grab.">Appeal</div>
              <div class="vote-stars" role="group" aria-label="Appeal rating">
                <button type="button" class="star-button" data-value="1" aria-label="1 star"></button>
                <button type="button" class="star-button" data-value="2" aria-label="2 stars"></button>
                <button type="button" class="star-button" data-value="3" aria-label="3 stars"></button>
                <button type="button" class="star-button" data-value="4" aria-label="4 stars"></button>
                <button type="button" class="star-button" data-value="5" aria-label="5 stars"></button>
              </div>
            </div>
            <div class="vote-slide" data-metric="understandability">
              <div class="vote-label" title="How easy it is to grasp at a glance.">Intuitive</div>
              <div class="vote-stars" role="group" aria-label="Intuitive rating">
                <button type="button" class="star-button" data-value="1" aria-label="1 star"></button>
                <button type="button" class="star-button" data-value="2" aria-label="2 stars"></button>
                <button type="button" class="star-button" data-value="3" aria-label="3 stars"></button>
                <button type="button" class="star-button" data-value="4" aria-label="4 stars"></button>
                <button type="button" class="star-button" data-value="5" aria-label="5 stars"></button>
              </div>
            </div>
            <div class="vote-slide" data-metric="professionalism">
              <div class="vote-label" title="Polish, technical quality, and print readiness.">Professionalism</div>
              <div class="vote-stars" role="group" aria-label="Professionalism rating">
                <button type="button" class="star-button" data-value="1" aria-label="1 star"></button>
                <button type="button" class="star-button" data-value="2" aria-label="2 stars"></button>
                <button type="button" class="star-button" data-value="3" aria-label="3 stars"></button>
                <button type="button" class="star-button" data-value="4" aria-label="4 stars"></button>
                <button type="button" class="star-button" data-value="5" aria-label="5 stars"></button>
              </div>
            </div>
            <div class="vote-slide vote-slide-comment" data-metric="comment">
              <div class="vote-label">Comment</div>
              <div class="vote-comment-row" role="group" aria-label="Comment">
                <textarea
                  id="commentInput"
                  rows="1"
                  placeholder="Optional..."
                ></textarea>
                <button class="comment-submit" id="commentSubmit" type="button" aria-label="Submit vote"></button>
              </div>
            </div>
          </div>
        </div>
        <button
          class="vote-nav-btn nav-skip"
          id="voteSkip"
          type="button"
          aria-label="Skip rating"
          title="Skip Asset: do not submit any votes for this asset"
        >
          &rsaquo;
        </button>
      </section>

      <section class="complete-panel hidden" id="completePanel">
        <h2>All caught up!</h2>
        <p>There are no more assets to review right now.</p>
        <button class="primary-btn" id="reloadButton" type="button">Check again</button>
      </section>
    </div>

    <div class="toast-host" id="toastHost" aria-live="polite"></div>
    <script type="module" src="../../js/tester/app.js"></script>
  </body>
</html>
